name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release

    - name: Pack
      id: pack
      run: |
        VERSION="1.3.${{ github.run_number }}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Packing version $VERSION"
        dotnet pack --no-build --configuration Release -o ./nupkg /p:Version=$VERSION

    - name: Publish to NuGet
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Upload DLL artifact
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: MWBot.net-dll
        path: MWBot.net/bin/Release/net10.0/MWBot.net.dll

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.pack.outputs.VERSION }}
        name: MWBot.net ${{ steps.pack.outputs.VERSION }}
        body: |
          Automated release from commit ${{ github.sha }}
          Version: ${{ steps.pack.outputs.VERSION }}
        files: |
          MWBot.net/bin/Release/net10.0/MWBot.net.dll
          nupkg/*.nupkg
        draft: false
        prerelease: false
